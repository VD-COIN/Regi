<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checking Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom right, #000000, #001f3f);
      color: white;
      font-family: 'Orbitron', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #console-box {
      padding: 30px;
      border: 2px solid #0077ff;
      border-radius: 10px;
      box-shadow: 0 0 20px #0077ff88;
      min-width: 300px;
      max-width: 600px;
      text-align: center;
    }

    #console {
      font-size: 1.5rem;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #fff;
      width: 0;
      display: inline-block;
      animation: typing 2s steps(40, end), blink 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    .line {
      opacity: 0;
    }

    .show {
      opacity: 1;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="console-box">
    <div id="console" class="line"></div>
  </div>

  <script>
    const steps = [
      "🔍 Checking your account in the system...",
      "🧠 Analyzing...",
      "⚙️ Inserting configuration...",
      "🛠️ Finalizing...",
      "✅ Access granted..."
    ];

    const typingSpeed = 1000;  // duration of typing animation
    const delayAfterTyping = 1500;  // pause after typing before clearing

    const consoleEl = document.getElementById('console');

    function showStep(index) {
      if (index >= steps.length) {
        // After all steps, redirect to home
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1000);
        return;
      }

      // Set content and trigger typing
      consoleEl.classList.remove('show');
      void consoleEl.offsetWidth; // force reflow
      consoleEl.textContent = steps[index];
      consoleEl.style.animation = 'none';
      void consoleEl.offsetWidth; // reflow again
      consoleEl.style.animation = 'typing 2s steps(40, end), blink 0.75s step-end infinite';
      consoleEl.classList.add('show');

      // Wait for typing + delay, then clear and go to next
      setTimeout(() => {
        consoleEl.classList.remove('show');
        setTimeout(() => {
          consoleEl.textContent = '';
          showStep(index + 1);
        }, 300); // match fade out
      }, typingSpeed + delayAfterTyping);
    }

    // Start
    showStep(0);
  </script>
</body>
</html>

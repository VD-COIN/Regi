<!DOCTYPE html>
<html lang="en" class="bg-gray-900 text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Courier New', monospace;
    }
    .cyber-glow {
      text-shadow: 0 0 5px #00ffea, 0 0 10px #00ffc8;
    }
    .input-glow:focus {
      box-shadow: 0 0 10px #0ff;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-800 to-black">

  <div class="w-full max-w-md bg-gray-800 p-8 rounded-lg shadow-lg border border-cyan-400">
    <h1 class="text-3xl cyber-glow text-center mb-6">🔐 Enter Your Password</h1>

    <label for="password" class="block mb-2 text-cyan-300">Password</label>
    <input
      type="password"
      id="password"
      class="w-full p-3 rounded bg-gray-900 border border-cyan-500 text-white input-glow focus:outline-none"
      placeholder="••••••••••••••••••••••"
    />

    <button
      onclick="verifyPassword()"
      class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 text-black font-bold py-2 px-4 rounded transition"
    >
      Go to Next
    </button>
  </div>

  <!-- Modal -->
  <div id="errorModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50">
    <div class="bg-red-700 text-white p-6 rounded-lg max-w-sm w-full shadow-lg border border-red-400">
      <h2 class="text-xl font-bold mb-4">Incorrect Password</h2>
      <p>The password you entered is not correct. Please try again.</p>
      <button onclick="closeModal()" class="mt-4 bg-red-400 hover:bg-red-500 px-4 py-2 rounded">
        Close
      </button>
    </div>
  </div>

  <script>
    function verifyPassword() {
      const enteredPassword = document.getElementById("password").value;
      const savedPassword = localStorage.getItem("password");

      if (enteredPassword === savedPassword) {
        // Mark user as "returned"
        localStorage.setItem("isReturned", "true");

        // Optionally remove password
        localStorage.removeItem("password");

        // Redirect
        window.location.href = "access.html";
      } else {
        document.getElementById("errorModal").classList.remove("hidden");
      }
    }

    function closeModal() {
      document.getElementById("errorModal").classList.add("hidden");
    }
  </script>

</body>
</html>
